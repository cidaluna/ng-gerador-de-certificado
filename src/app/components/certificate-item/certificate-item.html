<div class="card p-3 custom-card">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <div class="fw-bold name">{{ 'certificate.studentNameLabel' | transloco }}</div>
      <small class="small-date">
        {{ 'certificate.generatedOn' | transloco: { date: '20/04/2026' } }}
      </small>
    </div>
    <app-secondary-button
      [textButton]="'certificate.view' | transloco"
      (click)="redirectCertificate()"
    ></app-secondary-button>
  </div>
</div>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a routerLink="/" class="navbar-logo">
      <img src="navbar/logo.svg" [alt]="'nav.logoAlt' | translate" />
    </a>
    <div class="collapse navbar-collapse justify-content-end">
      <ul class="navbar-nav align-items-center">
        <li class="nav-item d-flex align-items-center">
          <i class="ph ph-medal"></i>
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ 'nav.listCertificates' | translate }}
          </a>
        </li>
        <li class="nav-item d-flex align-items-center">
          <i class="ph ph-target"></i>
          <a
            class="nav-link"
            routerLink="/certificados/novo"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ 'nav.generateCertificate' | translate }}
          </a>
        </li>
        <li class="nav-item language-switcher d-flex align-items-center">
          @for (locale of languages; track locale) {
            <button
              type="button"
              class="language-btn"
              [class.active]="currentLang() === locale"
              (click)="setLanguage(locale)"
            >
              {{ ('languages.' + locale) | translate }}
            </button>
          }
        </li>
      </ul>
    </div>
  </div>
</nav>
